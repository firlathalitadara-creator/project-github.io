<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Siswa | Smart Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255,255,255,0.06), transparent 30%),
                linear-gradient(135deg, #071a3d, #102d5c, #06152f);

            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            position: relative;
            overflow: hidden;

            background: linear-gradient(145deg, #fffaf0, #f4ead7);
            border-radius: 32px;
            padding: 28px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.8);

            animation: appear 0.6s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(15, 45, 91, 0.06);
            top: -90px;
            right: -70px;
        }

        .card::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(15, 45, 91, 0.04);
            bottom: -70px;
            left: -50px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* HEADER */
        .header {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 28px;
        }

        .logo {
            width: 55px;
            height: 55px;
            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 17px;

            background: linear-gradient(135deg, #081b3d, #173f79);

            color: #fffaf0;
            font-size: 26px;
            font-weight: bold;

            box-shadow: 0 8px 20px rgba(8, 27, 61, 0.25);
        }

        .header-text h1 {
            color: #081b3d;
            font-size: 24px;
            margin-bottom: 3px;
        }

        .header-text p {
            color: #6e6a61;
            font-size: 13px;
        }

        /* TITLE */
        .title-section {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 24px;
        }

        .success-icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #102f60, #214e91);

            color: white;
            font-size: 39px;
            font-weight: bold;

            box-shadow:
                0 12px 25px rgba(16, 47, 96, 0.25),
                inset 0 2px 5px rgba(255,255,255,0.2);
        }

        .title-section h2 {
            color: #081b3d;
            font-size: 23px;
            margin-bottom: 7px;
        }

        .title-section p {
            color: #777166;
            font-size: 13px;
        }

        /* PROFILE */
        .profile-card {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 18px;

            padding: 18px;

            background: #fffdf8;
            border: 1px solid rgba(8, 27, 61, 0.08);

            border-radius: 22px;

            box-shadow: 0 8px 25px rgba(8, 27, 61, 0.08);

            margin-bottom: 20px;
        }

        .profile-photo {
            width: 85px;
            height: 85px;

            flex-shrink: 0;

            border-radius: 50%;
            object-fit: cover;

            border: 5px solid #eef1f5;

            background: #dfe5ed;
        }

        .profile-info h3 {
            color: #081b3d;
            font-size: 21px;
            margin-bottom: 6px;
        }

        .profile-info p {
            color: #777166;
            font-size: 13px;
        }

        /* DATA */
        .data-grid {
            position: relative;
            z-index: 2;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-bottom: 20px;
        }

        .data-box {
            background: #fffdf8;

            border: 1px solid rgba(8, 27, 61, 0.08);

            border-radius: 17px;
            padding: 15px;

            box-shadow: 0 6px 15px rgba(8, 27, 61, 0.06);
        }

        .data-box.full {
            grid-column: span 2;
        }

        .label {
            display: block;

            color: #8a8479;
            font-size: 11px;
            font-weight: bold;

            text-transform: uppercase;

            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .value {
            color: #102d5c;
            font-size: 15px;
            font-weight: bold;
        }

        /* FOOTER */
        .footer {
            position: relative;
            z-index: 2;

            text-align: center;

            margin-top: 8px;
            padding-top: 18px;

            border-top: 1px solid rgba(8, 27, 61, 0.10);
        }

        .footer p {
            color: #7b766d;
            font-size: 11px;
            line-height: 1.6;
        }

        .footer strong {
            color: #102d5c;
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .card {
                padding: 22px;
                border-radius: 27px;
            }

            .profile-card {
                padding: 15px;
            }

            .profile-photo {
                width: 75px;
                height: 75px;
            }

            .profile-info h3 {
                font-size: 18px;
            }

            .data-grid {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <!-- HEADER -->
            <div class="header">
                <div class="logo">✓</div>

                <div class="header-text">
                    <h1>Absensi Siswa</h1>
                    <p>Smart Attendance System</p>
                </div>
            </div>


            <!-- TITLE -->
            <div class="title-section">

                <div class="success-icon">
                    ✓
                </div>

                <h2>Biodata Siswa</h2>

                <p>Data siswa dari hasil scan QR Code</p>

            </div>


            <!-- PROFILE -->
            <div class="profile-card">

                <img
                    src="foto-siswa.jpg"
                    alt="Foto Siswa"
                    class="profile-photo"
                >

                <div class="profile-info">

                    <h3 id="namaSiswa">
                        Nama Siswa
                    </h3>

                    <p>
                        Siswa Aktif • SMK Nusantara 1
                    </p>

                </div>

            </div>


            <!-- DATA -->
            <div class="data-grid">

                <div class="data-box">

                    <span class="label">
                        Nomor Antrian
                    </span>

                    <span class="value" id="antrianSiswa">
                        -
                    </span>

                </div>


                <div class="data-box">

                    <span class="label">
                        Kelas
                    </span>

                    <span class="value" id="kelasSiswa">
                        -
                    </span>

                </div>


                <div class="data-box full">

                    <span class="label">
                        Jurusan
                    </span>

                    <span class="value" id="jurusanSiswa">
                        -
                    </span>

                </div>

            </div>


            <!-- FOOTER -->
            <div class="footer">

                <p>
                    Biodata ini ditampilkan melalui
                    <strong>QR Code Absensi</strong>
                </p>

                <p>
                    Smart Attendance System • SMK Nusantara 1
                </p>

            </div>

        </div>

    </div>


    <script>

        /*
        ==========================================
        MENGAMBIL DATA DARI LINK QR
        ==========================================

        Contoh link:

        biodata.html?
        nama=Firla
        &antrian=04
        &kelas=XI
        &jurusan=RPL
        */

        const params = new URLSearchParams(
            window.location.search
        );


        const nama =
            params.get("nama") || "Nama Siswa";

        const antrian =
            params.get("antrian") || "-";

        const kelas =
            params.get("kelas") || "-";

        const jurusan =
            params.get("jurusan") || "-";


        document.getElementById("namaSiswa").innerText =
            nama;

        document.getElementById("antrianSiswa").innerText =
            antrian;

        document.getElementById("kelasSiswa").innerText =
            kelas;

        document.getElementById("jurusanSiswa").innerText =
            jurusan;

    </script>

</body>
</html>
